kind = "web"
previewPath = "/"
title = "StudyCircle"
version = "1.0.0"
id = "artifacts/studycircle"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24490

[services.development]
run = "pnpm --filter @workspace/studycircle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studycircle", "run", "build" ]
publicDir = "artifacts/studycircle/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24490"
BASE_PATH = "/"
