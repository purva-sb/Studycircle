openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: StudyCircle API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: me
  - name: dashboard
  - name: timer
  - name: circles
  - name: channels
  - name: messages
  - name: focus-rooms
  - name: exams
  - name: analytics
  - name: leaderboard
  - name: doubts
  - name: pods
  - name: resources
  - name: revision
  - name: calendar
  - name: achievements
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get the current (demo) user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary (today, week, streak, xp, level, goals progress)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }

  /dashboard/today-goals:
    get:
      operationId: getTodayGoals
      tags: [dashboard]
      summary: Today's goals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Goal" }
    post:
      operationId: createGoal
      tags: [dashboard]
      summary: Add a goal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGoalInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }

  /dashboard/today-goals/{id}/toggle:
    post:
      operationId: toggleGoal
      tags: [dashboard]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }

  /timer/sessions:
    get:
      operationId: listStudySessions
      tags: [timer]
      summary: List recent study sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudySession" }
    post:
      operationId: createStudySession
      tags: [timer]
      summary: Log a finished study session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStudySessionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }

  /timer/subjects:
    get:
      operationId: listSubjects
      tags: [timer]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }

  /timer/weekly:
    get:
      operationId: getWeeklyStudyMinutes
      tags: [timer]
      summary: Weekly study minutes per day
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyMinutes" }

  /circles:
    get:
      operationId: listCircles
      tags: [circles]
      summary: List study circles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Circle" }
    post:
      operationId: createCircle
      tags: [circles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCircleInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Circle" }

  /circles/discover:
    get:
      operationId: discoverCircles
      tags: [circles]
      summary: Discover trending public circles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Circle" }

  /circles/{id}:
    get:
      operationId: getCircle
      tags: [circles]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CircleDetail" }

  /circles/{id}/join:
    post:
      operationId: joinCircle
      tags: [circles]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Circle" }

  /circles/{id}/channels:
    get:
      operationId: listCircleChannels
      tags: [channels]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }

  /channels/{id}/messages:
    get:
      operationId: listChannelMessages
      tags: [messages]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: sendChannelMessage
      tags: [messages]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /messages/{id}/react:
    post:
      operationId: reactToMessage
      tags: [messages]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReactInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /focus-rooms:
    get:
      operationId: listFocusRooms
      tags: [focus-rooms]
      summary: List live focus rooms
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FocusRoom" }
    post:
      operationId: createFocusRoom
      tags: [focus-rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFocusRoomInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusRoom" }

  /focus-rooms/{id}:
    get:
      operationId: getFocusRoom
      tags: [focus-rooms]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusRoomDetail" }

  /focus-rooms/{id}/join:
    post:
      operationId: joinFocusRoom
      tags: [focus-rooms]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinFocusRoomBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusRoom" }

  /exams:
    get:
      operationId: listExams
      tags: [exams]
      summary: List available exams
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Exam" }

  /exams/{id}:
    get:
      operationId: getExam
      tags: [exams]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamDetail" }

  /exams/{id}/attempt:
    post:
      operationId: startExamAttempt
      tags: [exams]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamAttempt" }

  /attempts/{id}:
    get:
      operationId: getExamAttempt
      tags: [exams]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamAttempt" }

  /attempts/{id}/answer:
    post:
      operationId: submitAnswer
      tags: [exams]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAnswerInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamAttempt" }

  /attempts/{id}/submit:
    post:
      operationId: submitExamAttempt
      tags: [exams]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamResult" }

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Overall analytics (accuracy, percentile, time)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsOverview" }

  /analytics/topic-performance:
    get:
      operationId: getTopicPerformance
      tags: [analytics]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopicPerformance" }

  /analytics/score-trend:
    get:
      operationId: getScoreTrend
      tags: [analytics]
      summary: Score trend across recent attempts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScorePoint" }

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Leaderboard query
      parameters:
        - name: timeframe
          in: query
          required: true
          schema: { type: string, enum: [daily, weekly, monthly] }
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [global, circle, room] }
        - name: filterId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaderboardEntry" }
    post:
      operationId: triggerLeaderboardReset
      tags: [leaderboard]
      summary: Reset weekly/monthly leaderboards
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /users/profile/customize:
    post:
      operationId: customizeProfile
      tags: [me]
      summary: Update PRO customization (Aura & Avatar)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomizeProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /messages/{id}:
    put:
      operationId: updateMessage
      tags: [channels]
      summary: Update a message
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
    delete:
      operationId: deleteMessage
      tags: [channels]
      summary: Delete a message
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /doubts:
    get:
      operationId: listDoubts
      tags: [doubts]
      summary: List doubt bounties
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Doubt" }
    post:
      operationId: createDoubt
      tags: [doubts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDoubtInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doubt" }

  /doubts/{id}:
    get:
      operationId: getDoubt
      tags: [doubts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoubtDetail" }

  /doubts/{id}/answers:
    post:
      operationId: answerDoubt
      tags: [doubts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerDoubtInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoubtAnswer" }

  /doubts/answers/{id}/upvote:
    post:
      operationId: upvoteAnswer
      tags: [doubts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoubtAnswer" }

  /pods:
    get:
      operationId: listPods
      tags: [pods]
      summary: List accountability pods
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pod" }

  /pods/{id}:
    get:
      operationId: getPod
      tags: [pods]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PodDetail" }

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List resources from all circles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Resource" }
    post:
      operationId: createResource
      tags: [resources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateResourceInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }

  /revision/stats:
    get:
      operationId: getRevisionStats
      tags: [revision]
      summary: Get user revision stats like heatmap and streak
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionStats" }

  /revision/community-decks:
    get:
      operationId: listCommunityDecks
      tags: [revision]
      summary: Trending community decks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommunityDeck" }

  /revision/leaderboard:
    get:
      operationId: getRevisionLeaderboard
      tags: [revision]
      summary: Leaderboard of top reviewers today
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaderboardUser" }

  /revision/items:
    get:
      operationId: listRevisionItems
      tags: [revision]
      summary: Spaced-repetition items due today and upcoming
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RevisionItem" }
    post:
      operationId: createRevisionItem
      tags: [revision]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRevisionItemInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionItem" }

  /revision/items/{id}/review:
    post:
      operationId: reviewRevisionItem
      tags: [revision]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRevisionItemInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionItem" }

  /calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      summary: Upcoming events
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarEvent" }
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCalendarEventInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }

  /achievements:
    get:
      operationId: listAchievements
      tags: [achievements]
      summary: Earned and locked badges
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Achievement" }

  /sticky-notes:
    get:
      operationId: listStickyNotes
      tags: [stickyNotes]
      summary: List all sticky notes for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StickyNote" }
    post:
      operationId: createStickyNote
      tags: [stickyNotes]
      summary: Create a sticky note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStickyNoteInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickyNote" }

  /sticky-notes/{id}/pin:
    patch:
      operationId: pinStickyNote
      tags: [stickyNotes]
      summary: Toggle pin on a sticky note
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickyNote" }

  /sticky-notes/{id}:
    delete:
      operationId: deleteStickyNote
      tags: [stickyNotes]
      summary: Delete a sticky note
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }

  /aim:
    get:
      operationId: getAim
      tags: [aim]
      summary: Get the current user's aim
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/UserAim" }
                  - { type: "null" }
    put:
      operationId: upsertAim
      tags: [aim]
      summary: Create or update the user's aim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertAimInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAim" }
    delete:
      operationId: deleteAim
      tags: [aim]
      summary: Delete the user's aim
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Me:
      type: object
      required: [id, displayName, handle, avatarUrl, level, xp, xpForNextLevel, streakDays, examFocus, plan]
      properties:
        id: { type: string }
        displayName: { type: string }
        handle: { type: string }
        avatarUrl: { type: string }
        level: { type: integer }
        xp: { type: integer }
        xpForNextLevel: { type: integer }
        streakDays: { type: integer }
        examFocus: { type: string }
        plan: { type: string, enum: [free, pro] }

    DashboardSummary:
      type: object
      required:
        [
          todayMinutes,
          weeklyMinutes,
          streakDays,
          level,
          xp,
          xpForNextLevel,
          accuracy,
          rankPercentile,
          activeCircles,
          dailyTargetMinutes,
          upcomingExam,
        ]
      properties:
        todayMinutes: { type: integer }
        weeklyMinutes: { type: integer }
        streakDays: { type: integer }
        level: { type: integer }
        xp: { type: integer }
        xpForNextLevel: { type: integer }
        accuracy: { type: number }
        rankPercentile: { type: number }
        activeCircles: { type: integer }
        dailyTargetMinutes: { type: integer }
        upcomingExam:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/UpcomingExam" }

    UpcomingExam:
      type: object
      required: [id, title, startsAt, daysAway]
      properties:
        id: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        daysAway: { type: integer }

    ActivityItem:
      type: object
      required: [id, kind, title, subtitle, createdAt]
      properties:
